# マルシェのセミナー屋台: 厚労省RSSからセミナー・フォーラム案内を毎日自動で取り込む
name: marche-seminars-update
on:
  schedule:
    - cron: "40 21 * * *" # 毎日 6:40 (日本時間)
  workflow_dispatch: {}   # 手動実行も可能
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: セミナー情報を取得してseminars.jsonを更新
        run: node scripts/fetch-seminars.mjs
      - name: 変更があればコミット
        run: |
          git config user.name "marche-seminar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seminars.json
          git diff --cached --quiet || (git commit -m "マルシェ: セミナー情報自動更新" && git push)
